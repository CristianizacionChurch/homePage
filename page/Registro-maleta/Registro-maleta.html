<style>
        body {
            background-image:
                linear-gradient(to right, rgba(91, 64, 57, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(91, 64, 57, 0.1) 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
        }
        .blinking-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-16 font-body-md relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-background border-b border-outline-variant flat transition-colors duration-150">
<button class="text-on-surface-variant hover:bg-surface-variant p-2 -ml-2">
<span class="material-symbols-outlined">security</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tighter">MAYDAY 2026</h1>
<span class="font-label-caps text-label-caps text-on-surface-variant">REGISTRO</span>
</div>
<button class="text-on-surface-variant hover:bg-surface-variant p-2 -mr-2">
<span class="material-symbols-outlined">settings_input_component</span>
</button>
</header>
<main class="flex-grow p-margin-mobile flex flex-col gap-gutter">
<!-- Header Section -->
<section class="mb-4">
<h2 class="font-headline-md text-headline-md text-on-background uppercase tracking-tight">Registro-maleta</h2>
<div class="h-px bg-outline-variant mt-2 w-1/3"></div>
</section>
<!-- Input Form -->
<form class="flex flex-col gap-6 w-full" id="registrationForm">
<div class="bg-surface-container border border-outline-variant p-4 relative">
<div class="absolute -top-2 -left-px bg-background px-1">
<span class="font-label-caps text-label-caps text-secondary-fixed">01_NOMBRE</span>
</div>
<input class="w-full bg-transparent border-b border-outline-variant text-on-background font-data-mono text-body-lg focus:outline-none focus:border-primary focus:ring-0 rounded-none py-2 px-0 blinking-cursor" id="nombreInput" placeholder="INGRESE NOMBRE" required="" type="text">
</div>
<div class="bg-surface-container border border-outline-variant p-4 relative">
<div class="absolute -top-2 -left-px bg-background px-1">
<span class="font-label-caps text-label-caps text-secondary-fixed">02_APELLIDO</span>
</div>
<input class="w-full bg-transparent border-b border-outline-variant text-on-background font-data-mono text-body-lg focus:outline-none focus:border-primary focus:ring-0 rounded-none py-2 px-0 blinking-cursor" id="apellidoInput" placeholder="INGRESE APELLIDO" required="" type="text">
</div>
<!-- Action Button -->
<button id="generateBtn" class="w-full bg-primary-container text-[#000000] border border-outline-variant py-4 px-6 font-headline-sm text-headline-sm uppercase tracking-wider hover:bg-primary transition-colors active:scale-95" type="button">
                Generar Código Único
            </button>
</form>
<!-- Result Card (Hidden initially) -->
<div class="hidden mt-8 bg-surface-container-highest border border-primary p-6 relative scanline" id="resultCard">
<div class="absolute top-2 right-2 flex gap-1">
<div class="w-2 h-2 bg-primary-container animate-pulse"></div>
<div class="w-2 h-2 bg-primary-container animate-pulse delay-75"></div>
</div>
<div class="absolute -top-3 left-4 bg-background px-2">
<span class="font-label-caps text-label-caps text-primary">STATUS: AUTORIZADO</span>
</div>
<div class="flex flex-col items-center justify-center py-8">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2">ID_ASIGNADO</span>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-widest tabular-nums text-6xl" id="generatedCodeDisplay">
                    ----
                </div>
<div class="mt-6 w-full h-px bg-outline-variant"></div>
<div class="mt-4 text-center">
<span class="font-label-caps text-label-caps text-secondary">CAMPISTA:</span>
<div class="font-data-mono text-data-mono text-on-background uppercase mt-1" id="campistaNameDisplay">
                         [ESPERANDO DATOS]
                     </div>
</div>
</div>
</div>
<!-- Instructions Footer -->
<footer class="mt-auto pt-8 pb-4">
<div class="border-l-2 border-outline-variant pl-4 py-2">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-2">PROTOCOLO DE OPERACIÓN</h3>
<ul class="font-data-mono text-data-mono text-on-background flex flex-col gap-2">
<li class="flex gap-2">
<span class="text-secondary-fixed">&gt;</span>
<span class="">1. Anote este código de 4 dígitos y pase los datos a la Sección B.</span>
</li>
<li class="flex gap-2">
<span class="text-secondary-fixed">&gt;</span>
<span class="">2. Entregue la tarjeta física con el código al campista.</span>
</li>
</ul>
</div>
</footer>
</main>
<script>
        function generateCode() {
            var nombre = document.getElementById('nombreInput').value.trim();
            var apellido = document.getElementById('apellidoInput').value.trim();
            var resultCard = document.getElementById('resultCard');
            var codeDisplay = document.getElementById('generatedCodeDisplay');
            var nameDisplay = document.getElementById('campistaNameDisplay');

            if (nombre && apellido) {
                var code = Math.floor(1000 + Math.random() * 9000);
                resultCard.classList.remove('hidden');
                resultCard.classList.add('flex', 'flex-col');
                var iterations = 0;
                var interval = setInterval(function() {
                    codeDisplay.innerText = Math.floor(1000 + Math.random() * 9000);
                    iterations++;
                    if (iterations >= 10) {
                        clearInterval(interval);
                        codeDisplay.innerText = code;
                        nameDisplay.innerText = nombre + ' ' + apellido;
                    }
                }, 50);
            } else {
                alert('SE REQUIERE NOMBRE Y APELLIDO PARA PROCEDER.');
            }
        }
        document.getElementById('generateBtn').addEventListener('click', generateCode);
    </script>
</body></html>
